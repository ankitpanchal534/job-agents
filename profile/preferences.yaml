# Your job preferences. Edit this file freely; run `python -m jobagent check-config` to validate it.
# Hard filters are applied BEFORE any skill scoring: a job that fails one is rejected and logged.

target:
  roles:
    - Frontend Engineer
    - Frontend Developer
    - Application Developer
    - Web Developer
    - React.js Developer
    - React Developer
    - Software Engineer (Frontend)
    - UI Engineer
    - Next.js Developer

  exclude_title_keywords:
    - intern
    - internship
    - unpaid

  seniority:
    - junior
    - mid
    - senior

  years_experience:
    min: 0
    max: 40

  job_types:
    - full-time

locations:
  countries:
    - India
    - United Kingdom
    - United States
    - Germany
    - Netherlands
    - Canada
    - Australia
    - Singapore
    - United Arab Emirates

  cities:
    - Gurgaon
    - Gurugram
    - Bengaluru
    - Bangalore
    - Hyderabad
    - Pune
    - Mumbai
    - Noida
    - Delhi
    - Chennai

  remote: allowed

  open_to_relocation: true

compensation:
  salary_floor: 0
  currency: INR
  period: year

work_authorization:
  - country: "India"
    authorized: true
    needs_sponsorship: false

  - country: "UK"
    authorized: true
    needs_sponsorship: true

  - country: "US (United States)"
    authorized: true
    needs_sponsorship: true

availability:
  notice_period_days: 30

blacklist:
  companies:
    - Deloitte

  description_keywords: []