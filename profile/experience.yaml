    summary_long: "Led frontend development across three enterprise products (ROI Calculator, Value Tracking, and Strategy & Value Mapper) within Deloitte's Energy & Retail Industry practice, collaborating with product managers and enterprise stakeholders from requirements through production delivery. Designed and developed a financial planning platform supporting dynamic investment modeling with real-time ROI, NPV, IRR, payback period, project cost, and projected benefit calculations using React, TypeScript, Redux, TanStack Query, and Recharts. Developed 50+ production screens and 50+ reusable React components within a Microfrontend architecture, establishing a shared UI foundation across multiple enterprise applications. Integrated 200+ REST APIs while implementing Microsoft SSO, JWT authentication, cookie-based authorization, and efficient asynchronous data management using TanStack Query. Improved application maintainability and performance through reusable component patterns, conditional rendering, route-level code splitting, lazy loading, virtualization, React.memo, useMemo, useCallback, and systematic frontend refactoring. Mentored three frontend engineers, reviewed pull requests, and contributed to engineering standards across applications supporting 500+ business users."
